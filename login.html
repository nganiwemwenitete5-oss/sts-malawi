<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>STS Malawi Login</title>
</head>
<body>

<h2>STS Malawi Admin Login</h2>

<input type="email" id="email" placeholder="Email">
<br><br>

<input type="password" id="password" placeholder="Password">
<br><br>

<button id="loginBtn">Login</button>

<p id="message"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyApfHHFX91RMVeQV-gb2xuutZ828Z-emeI",
  authDomain: "student-transport-services.firebaseapp.com",
  projectId: "student-transport-services",
  storageBucket: "student-transport-services.firebasestorage.app",
  messagingSenderId: "723755585577",
  appId: "1:723755585577:web:8428a99cfd50d1586b0c38"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginBtn").addEventListener("click", () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      window.location.href = "admin.html";
    })
    .catch((error) => {
      document.getElementById("message").innerText =
      error.message;
    });

});

</script>

</body>
</html>
