<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>STS Malawi - Admin Dashboard</title><style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    margin: 0;
    color: #222;
}

header {
    background: #0b5ed7;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 10px 0;
}

header p {
    margin: 5px 0;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
    overflow-x: auto;
}

button {
    background: #0b5ed7;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
}

.logout {
    background: #dc3545;
    float: right;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    min-width: 900px;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #f0f3f7;
}

#message {
    margin: 15px 0;
    padding: 12px;
    font-weight: bold;
    border-radius: 6px;
    background: #e9f2ff;
}

</style></head><body><header><button class="logout" id="logoutBtn">
Logout
</button><h1>STS Malawi</h1><p>Administrator Dashboard</p></header><div class="container"><div class="card"><h2>Student Transport Bookings</h2><div id="message">
Connecting to Firebase...
</div><table><thead><tr>
<th>Student</th>
<th>School</th>
<th>Grade</th>
<th>Parent</th>
<th>Phone</th>
<th>Email</th>
<th>Pickup</th>
<th>Destination</th>
<th>District</th>
<th>Status</th>
</tr></thead><tbody id="bookingTable"></tbody></table></div></div><script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyApfHHFX91RMVeQV-gb2xuutZ828Z-emeI",

    authDomain: "student-transport-services.firebaseapp.com",

    projectId: "student-transport-services",

    storageBucket: "student-transport-services.firebasestorage.app",

    messagingSenderId: "723755585577",

    appId: "1:723755585577:web:8428a99cfd50d1586b0c38",

    measurementId: "G-1R7Q3GGH0K"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const message = document.getElementById("message");

const table = document.getElementById("bookingTable");


onAuthStateChanged(auth, async (user) => {

    if (!user) {

        message.textContent =
        "You are not logged in. Please log in again.";

        return;
    }


    message.textContent =
    "Logged in. Loading bookings...";


    try {

        const snapshot = await getDocs(
            collection(db, "bookings")
        );


        console.log(
            "Firebase project:",
            app.options.projectId
        );

        console.log(
            "Bookings found:",
            snapshot.size
        );


        table.innerHTML = "";


        if (snapshot.empty) {

            message.textContent =
            "No bookings found.";

            return;
        }


        message.textContent =
        snapshot.size + " booking(s) found.";


        snapshot.forEach((doc) => {

            const data = doc.data();

            console.log("Booking:", doc.id, data);


            const row = document.createElement("tr");


            row.innerHTML = `

                <td>${data.studentName || ""}</td>

                <td>${data.school || ""}</td>

                <td>${data.grade || ""}</td>

                <td>${data.parentName || ""}</td>

                <td>${data.phone || ""}</td>

                <td>${data.email || ""}</td>

                <td>${data.pickup || ""}</td>

                <td>${data.destination || ""}</td>

                <td>${data.district || ""}</td>

                <td>${data.status || "Pending"}</td>

            `;


            table.appendChild(row);

        });


    } catch (error) {

        console.error(
            "FIREBASE ADMIN ERROR:",
            error
        );


        message.textContent =
        "Firebase error: " + error.message;

    }

});


document
.getElementById("logoutBtn")
.addEventListener("click", async () => {

    try {

        await signOut(auth);

        window.location.href = "login.html";

    } catch (error) {

        console.error(error);

    }

});

</script></body>
</html>
